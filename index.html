<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#08120e">
  <title>مصروفي</title>
  <style>
    :root{--bg:#08120e;--card:#102019;--text:#e9f5ee;--muted:#9bb1a4;--green:#4ade80;--red:#fb7185;--border:#ffffff18}
    *{box-sizing:border-box}
    body{margin:0;padding:18px 14px 60px;max-width:680px;margin-inline:auto;background:radial-gradient(700px 400px at 85% 0,#16412a,transparent 65%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
    h1{font-size:23px;margin:0}h2{font-size:16px;margin:0 0 12px}
    .top,.row,.between{display:flex;align-items:center;gap:9px}.top,.between{justify-content:space-between}
    .card{padding:15px;margin:12px 0;background:linear-gradient(160deg,#ffffff12,#ffffff05);border:1px solid var(--border);border-radius:18px}
    input,select,textarea,button{font:inherit;border-radius:11px;padding:10px;border:1px solid var(--border)}
    input,select,textarea{width:100%;background:#ffffff0b;color:var(--text)}
    select option{color:#111}textarea{min-height:90px;resize:vertical}
    button{background:var(--green);color:#062713;border:0;font-weight:700;cursor:pointer}
    button.secondary{background:#ffffff10;color:var(--text);border:1px solid var(--border)}
    button.danger{background:#4b1720;color:#ffdce1}
    .form{display:grid;gap:8px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
    .stat{text-align:center;padding:11px 4px;border-radius:13px;background:#ffffff08}
    .stat small{display:block;color:var(--muted);font-size:12px}.stat b{font-size:17px}
    .out{color:var(--red)}.in{color:var(--green)}.muted{color:var(--muted);font-size:13px}
    .tx{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-top:1px solid var(--border)}
    .tx:first-child{border-top:0}.txname{font-weight:650}.txmeta{font-size:12px;color:var(--muted);margin-top:3px}
    .amount{white-space:nowrap;text-align:left;font-weight:700}.tx select{width:auto;padding:4px 7px;font-size:12px;margin-top:6px}
    .smallbtn{padding:2px 7px;background:none;color:var(--muted);font-size:19px}
    .msg{min-height:20px;color:var(--green);font-size:13px}
    .account{padding:10px 0;border-top:1px solid var(--border)}
    .account:first-child{border-top:0}.accountline{display:flex;align-items:center;gap:7px}
    .accountline input{flex:1}.inline{display:flex;gap:7px}
    details summary{cursor:pointer;font-weight:650}
    .bar{height:8px;background:#ffffff12;border-radius:8px;overflow:hidden;margin-top:6px}
    .bar i{display:block;height:100%;background:var(--green)}
    #toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#102019;border:1px solid var(--green);padding:10px 16px;border-radius:20px;opacity:0;transition:.2s;pointer-events:none}
    #toast.show{opacity:1}
  </style>
</head>
<body>
  <div class="top">
    <h1>💰 مصروفي</h1>
    <select id="month" style="width:auto" aria-label="الشهر"></select>
  </div>

  <section class="card">
    <div class="stats">
      <div class="stat"><small>مصروفات</small><b id="totalOut" class="out">0</b></div>
      <div class="stat"><small>دخل</small><b id="totalIn" class="in">0</b></div>
      <div class="stat"><small>الصافي</small><b id="net">0</b></div>
    </div>
    <div id="limitInfo"></div>
  </section>

  <section class="card">
    <h2>➕ الصق رسالة البنك</h2>
    <textarea id="sms" placeholder="الصق رسالة البنك هنا…"></textarea>
    <div class="row" style="margin-top:8px">
      <button id="parseBtn">حلّل وضيف</button>
      <button class="secondary" id="pasteBtn">لصق من الحافظة</button>
    </div>
    <p class="msg" id="message"></p>
  </section>

  <section class="card">
    <h2>إضافة عملية يدويًا</h2>
    <div class="form">
      <input id="amount" type="number" min="0" step="0.01" placeholder="المبلغ">
      <input id="merchant" placeholder="الوصف أو المكان">
      <div class="inline">
        <select id="direction"><option value="out">مصروف</option><option value="in">دخل</option></select>
        <select id="category"></select>
      </div>
      <select id="account"></select>
      <button id="addBtn">إضافة العملية</button>
    </div>
  </section>

  <section class="card">
    <div class="between">
      <h2>💳 الحسابات والكروت</h2>
      <button class="secondary" id="addAccountBtn">إضافة حساب</button>
    </div>
    <div id="accounts"></div>
    <p class="muted">أدخل اسم الحساب وآخر ٤ أرقام اختياريًا. لا تدخل رقم الكارت كاملًا.</p>
  </section>

  <section class="card">
    <h2>🧾 العمليات</h2>
    <div id="transactions"></div>
  </section>

  <section class="card">
    <details>
      <summary>نسخ احتياطي واستعادة</summary>
      <div class="form" style="margin-top:12px">
        <button class="secondary" id="backupBtn">نسخ البيانات JSON</button>
        <button class="secondary" id="csvBtn">تنزيل CSV</button>
        <textarea id="restoreText" placeholder="الصق نسخة JSON هنا للاستعادة"></textarea>
        <button class="secondary" id="restoreBtn">استعادة البيانات</button>
        <button class="danger" id="wipeBtn">مسح كل البيانات</button>
      </div>
    </details>
  </section>
  <div id="toast"></div>

<script>
"use strict";

const KEY = "masrofi_v3";
const CATS = ["أكل وشراب","سوبرماركت","مواصلات","فواتير واتصالات","تسوق","ترفيه","صحة","تحويلات","سحب نقدي","دخل","أخرى"];
const RULES = [
  ["سحب نقدي",["atm","سحب نقدي","cash withdrawal","withdrawal"]],
  ["أكل وشراب",["talabat","طلبات","restaurant","مطعم","cafe","كافيه","coffee","starbucks","mcdonald","kfc"]],
  ["سوبرماركت",["carrefour","كارفور","supermarket","سوبرماركت","spinneys","سعودي","kazyon"]],
  ["مواصلات",["uber","careem","كريم","indrive","بنزين","مترو","قطار","parking"]],
  ["فواتير واتصالات",["vodafone","فودافون","orange","أورانج","etisalat","اتصالات","كهرباء","فاتورة","fawry","فوري"]],
  ["تسوق",["amazon","noon","jumia","shein","zara","ملابس","ikea"]],
  ["ترفيه",["netflix","spotify","shahid","سينما","playstation","steam","youtube"]],
  ["صحة",["صيدلية","pharmacy","مستشفى","hospital","عيادة","دواء"]],
  ["تحويلات",["instapay","انستاباي","تحويل","transfer","wallet","محفظة"]]
];

function initialState(){
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && Array.isArray(s.tx) && Array.isArray(s.accounts)) return s;
  } catch (_) {}
  return {accounts:[], tx:[]};
}
let state = initialState();
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));
const money = n => Number(n || 0).toLocaleString("ar-EG",{maximumFractionDigits:2});
const monthKey = t => {
  const d = new Date(t);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
};
function save(){ localStorage.setItem(KEY, JSON.stringify(state)); }
function toast(text){
  $("toast").textContent = text;
  $("toast").classList.add("show");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(()=>$("toast").classList.remove("show"),2300);
}
function accountName(id){
  const a = state.accounts.find(x=>x.id===id);
  return a ? a.name + (a.last4 ? " ••"+a.last4 : "") : "غير محدد";
}
function categoryFor(text){
  const s = text.toLowerCase();
  for(const [cat,words] of RULES) if(words.some(w=>s.includes(w))) return cat;
  return "أخرى";
}
function parseMessage(raw){
  const text = raw.replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/٫/g,".").replace(/٬/g,",").replace(/\s+/g," ").trim();
  if(!text) return null;

  const amountRe = /(?:EGP|LE|L\.E\.?|جنيه|ج\.م|£)\s*([\d,]+(?:\.\d+)?|[\d]+(?:\.\d+)?)|([\d,]+(?:\.\d+)?|[\d]+(?:\.\d+)?)\s*(?:EGP|LE|L\.E\.?|جنيه|ج\.م|£)/ig;
  let amount = null;
  for(const m of text.matchAll(amountRe)){
    const before = text.slice(Math.max(0,m.index-30),m.index).toLowerCase();
    if(/balance|الرصيد|المتاح/.test(before)) continue;
    amount = Number((m[1] || m[2]).replace(/,/g,""));
    break;
  }
  if(!Number.isFinite(amount) || amount <= 0) return null;

  const credit = /(credited|received|deposit|salary|refund|cashback|إيداع|ايداع|استلام|راتب|دائن|وارد|مرتجع|استرداد)/i.test(text);
  const debit = /(purchase|spent|withdraw|debited|paid|payment|شراء|سحب|خصم|تم دفع|دفع|مدين)/i.test(text);
  const dir = credit && !debit ? "in" : "out";

  const last4Match = text.match(/(?:card|بطاقة|كارت|ending|\*{2,}|x{2,})\D{0,8}(\d{4})/i);
  const last4 = last4Match ? last4Match[1] : "";
  const bankNames = ["CIB","البنك الأهلي","بنك مصر","QNB","HSBC","بنك القاهرة","Telda","فودافون كاش","انستاباي"];
  const lower = text.toLowerCase();
  const bank = bankNames.find(b=>lower.includes(b.toLowerCase())) || "";

  const acc = state.accounts.find(a => last4 && a.last4 === last4) ||
    (bank ? state.accounts.find(a=>a.name.toLowerCase()===bank.toLowerCase()) : null);
  const merchantMatch = text.match(/(?:at|لدى|عند|merchant[:\s]+)\s*([^.,;()\d]{2,35})/i);
  const merchant = merchantMatch ? merchantMatch[1].trim() : text.slice(0,32);

  return {
    id:"t"+Date.now().toString(36)+Math.random().toString(36).slice(2,7),
    ts:Date.now(), amount, dir, category:dir==="in"?"دخل":categoryFor(text+" "+merchant),
    merchant, accountId:acc ? acc.id : "", source:"sms"
  };
}
function fillSelects(){
  $("category").innerHTML = CATS.filter(c=>c!=="دخل").map(c=>`<option>${esc(c)}</option>`).join("");
  const options = '<option value="">غير محدد</option>' +
    state.accounts.map(a=>`<option value="${esc(a.id)}">${esc(accountName(a.id))}</option>`).join("");
  $("account").innerHTML = options;
}
function render(){
  const monthSelect = $("month");
  const oldMonth = monthSelect.value;
  const months = [...new Set([monthKey(Date.now()),...state.tx.map(t=>monthKey(t.ts))])].sort().reverse();
  monthSelect.innerHTML = months.map(k=>{
    const [y,m] = k.split("-");
    const label = new Date(Number(y),Number(m)-1,1).toLocaleDateString("ar-EG",{month:"long",year:"numeric"});
    return `<option value="${k}">${esc(label)}</option>`;
  }).join("");
  monthSelect.value = months.includes(oldMonth) ? oldMonth : months[0];

  const selectedMonth = monthSelect.value;
  const tx = state.tx.filter(t=>monthKey(t.ts)===selectedMonth).sort((a,b)=>b.ts-a.ts);
  const out = tx.filter(t=>t.dir==="out").reduce((s,t)=>s+Number(t.amount),0);
  const inc = tx.filter(t=>t.dir==="in").reduce((s,t)=>s+Number(t.amount),0);
  $("totalOut").textContent = money(out);
  $("totalIn").textContent = money(inc);
  $("net").textContent = money(inc-out);
  $("net").className = inc-out >= 0 ? "in" : "out";

  const topAccount = state.accounts[0];
  $("limitInfo").innerHTML = topAccount && Number(topAccount.limit)>0
    ? `<p class="muted">المصروفات: ${money(out)} من حد ${money(topAccount.limit)}</p>
       <div class="bar"><i style="width:${Math.min(100,out/topAccount.limit*100)}%"></i></div>`
    : "";

  $("transactions").innerHTML = tx.length ? tx.map(t=>`
    <div class="tx">
      <div>
        <div class="txname">${esc(t.merchant || "عملية")}</div>
        <div class="txmeta">${new Date(t.ts).toLocaleDateString("ar-EG")} · ${esc(accountName(t.accountId))}</div>
        <div class="row">
          <select aria-label="التصنيف" onchange="changeCategory('${esc(t.id)}',this.value)">
            ${CATS.map(c=>`<option ${c===t.category?"selected":""}>${esc(c)}</option>`).join("")}
          </select>
          <select aria-label="الحساب" onchange="changeAccount('${esc(t.id)}',this.value)">
            <option value="">غير محدد</option>
            ${state.accounts.map(a=>`<option value="${esc(a.id)}" ${a.id===t.accountId?"selected":""}>${esc(accountName(a.id))}</option>`).join("")}
          </select>
        </div>
      </div>
      <div class="amount ${t.dir==="in"?"in":"out"}">
        ${t.dir==="in"?"+":"−"}${money(t.amount)}
        <button class="smallbtn" aria-label="حذف العملية" onclick="deleteTx('${esc(t.id)}')">×</button>
      </div>
    </div>`).join("") : '<p class="muted">مفيش عمليات في الشهر ده.</p>';

  $("accounts").innerHTML = state.accounts.length ? state.accounts.map(a=>`
    <div class="account">
      <div class="accountline">
        <input value="${esc(a.name)}" aria-label="اسم الحساب" onchange="updateAccount('${esc(a.id)}','name',this.value)">
        <span class="muted">${a.last4 ? "••"+esc(a.last4) : ""}</span>
        <button class="smallbtn" aria-label="حذف الحساب" onclick="deleteAccount('${esc(a.id)}')">×</button>
      </div>
      <div class="inline" style="margin-top:7px">
        <select onchange="updateAccount('${esc(a.id)}','type',this.value)">
          <option value="debit" ${a.type==="debit"?"selected":""}>Debit</option>
          <option value="credit" ${a.type==="credit"?"selected":""}>Credit</option>
        </select>
        <input type="number" min="0" placeholder="الحد الائتماني" value="${Number(a.limit)||""}" onchange="updateAccount('${esc(a.id)}','limit',this.value)">
      </div>
    </div>`).join("") : '<p class="muted">لسه مفيش حسابات. تقدر تضيفها أو تسجل العمليات بدون حساب.</p>';

  fillSelects();
}
function addTransaction(t){
  if(!t) return false;
  state.tx.push(t);
  save();render();
  return true;
}
function changeCategory(id,value){
  const t=state.tx.find(x=>x.id===id);if(t){t.category=value;save();render();}
}
function changeAccount(id,value){
  const t=state.tx.find(x=>x.id===id);if(t){t.accountId=value;save();render();}
}
function deleteTx(id){
  if(confirm("تمسح العملية دي؟")){state.tx=state.tx.filter(t=>t.id!==id);save();render();}
}
function updateAccount(id,key,value){
  const a=state.accounts.find(x=>x.id===id);if(!a)return;
  a[key]=key==="limit"?Math.max(0,Number(value)||0):value;save();render();
}
function deleteAccount(id){
  if(!confirm("حذف الحساب؟ العمليات المرتبطة به ستصبح غير محددة."))return;
  state.accounts=state.accounts.filter(a=>a.id!==id);
  state.tx.forEach(t=>{if(t.accountId===id)t.accountId="";});
  save();render();
}
function addAccount(){
  const name=prompt("اكتب اسم البنك أو الحساب:");
  if(!name || !name.trim())return;
  let last4=(prompt("آخر ٤ أرقام (اختياري):")||"").replace(/\D/g,"").slice(0,4);
  state.accounts.push({
    id:"a"+Date.now().toString(36)+Math.random().toString(36).slice(2,5),
    name:name.trim(),last4,type:"debit",limit:0
  });
  save();render();
}
$("addBtn").onclick=()=>{
  const amount=Number($("amount").value);
  if(!Number.isFinite(amount)||amount<=0){toast("اكتب مبلغًا صحيحًا");return;}
  addTransaction({
    id:"m"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),
    ts:Date.now(),amount,dir:$("direction").value,
    category:$("direction").value==="in"?"دخل":$("category").value,
    merchant:$("merchant").value.trim()||"عملية يدوية",
    accountId:$("account").value,source:"manual"
  });
  $("amount").value="";$("merchant").value="";toast("اتضافت العملية");
};
$("parseBtn").onclick=()=>{
  const parts=$("sms").value.split(/\n\s*\n/).map(s=>s.trim()).filter(Boolean);
  let count=0;
  for(const part of parts){const t=parseMessage(part);if(t){addTransaction(t);count++;}}
  $("message").textContent=count ? `اتضافت ${count} عملية. راجع المبلغ والتصنيف قبل الاعتماد.` : "ملقتش مبلغًا واضحًا في الرسالة.";
  if(count)$("sms").value="";
};
$("pasteBtn").onclick=async()=>{
  try{$("sms").value=await navigator.clipboard.readText();}
  catch(_){toast("الصق الرسالة يدويًا في الخانة");}
};
$("addAccountBtn").onclick=addAccount;
$("month").onchange=render;

$("backupBtn").onclick=async()=>{
  const data=JSON.stringify(state,null,2);
  try{await navigator.clipboard.writeText(data);toast("اتنسخت البيانات");}
  catch(_){$("restoreText").value=data;toast("النسخ التلقائي غير متاح؛ البيانات ظهرت في الخانة");}
};
$("restoreBtn").onclick=()=>{
  try{
    const d=JSON.parse($("restoreText").value);
    if(!d || !Array.isArray(d.accounts) || !Array.isArray(d.tx))throw new Error();
    if(!confirm("الاستعادة هتستبدل البيانات الحالية. تكمل؟"))return;
    state={
      accounts:d.accounts.filter(a=>a&&typeof a.id==="string").map(a=>({
        id:a.id,name:String(a.name||"حساب"),last4:String(a.last4||"").replace(/\D/g,"").slice(0,4),
        type:a.type==="credit"?"credit":"debit",limit:Math.max(0,Number(a.limit)||0)
      })),
      tx:d.tx.filter(t=>t&&typeof t==="object"&&Number(t.amount)>0).map(t=>({
        id:String(t.id||("t"+Math.random())),ts:Number(t.ts)||Date.now(),
        amount:Number(t.amount),dir:t.dir==="in"?"in":"out",
        category:CATS.includes(t.category)?t.category:"أخرى",
        merchant:String(t.merchant||"عملية"),accountId:String(t.accountId||""),source:String(t.source||"restore")
      }))
    };
    save();render();$("restoreText").value="";toast("تمت الاستعادة");
  }catch(_){toast("ملف النسخة غير صالح");}
};
$("csvBtn").onclick=()=>{
  const quote=s=>'"'+String(s??"").replace(/"/g,'""')+'"';
  const rows=[["date","type","amount","category","merchant","account"]];
  state.tx.forEach(t=>rows.push([
    new Date(t.ts).toISOString().slice(0,10),t.dir,t.amount,t.category,t.merchant,accountName(t.accountId)
  ]));
  const csv="\ufeff"+rows.map(r=>r.map(quote).join(",")).join("\n");
  const url=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
  const a=document.createElement("a");a.href=url;a.download="masrofi.csv";a.click();
  URL.revokeObjectURL(url);
};
$("wipeBtn").onclick=()=>{
  if(confirm("مسح كل الحسابات والعمليات؟ لا يمكن التراجع.")){
    state={accounts:[],tx:[]};save();render();toast("تم مسح البيانات");
  }
};
render();
</script>
</body>
</html>
