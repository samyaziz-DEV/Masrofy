<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08120e">
<title>مصروفي</title>
<style>
:root{--tx:#e9f5ee;--mut:#8fa89b;--g:#4ade80;--g2:#22c55e;--red:#fb7185;--bd:rgba(255,255,255,.09)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;color:var(--tx);font-family:-apple-system,"SF Arabic","Segoe UI",Tahoma,sans-serif;padding:16px 14px 70px;max-width:640px;margin-inline:auto;min-height:100vh;
background:radial-gradient(900px 500px at 85% -10%,rgba(74,222,128,.20),transparent 60%),radial-gradient(700px 500px at -10% 35%,rgba(20,184,166,.13),transparent 60%),#08120e;background-attachment:fixed}
h1{font-size:22px;margin:0}
h2{font-size:15px;margin:0 0 10px}
h3{font-size:14px;margin:14px 0 8px}
.glass{background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border:1px solid var(--bd);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:18px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center}
.between{justify-content:space-between}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
select,input,textarea{width:100%;font:inherit;color:var(--tx);background:rgba(255,255,255,.06);border:1px solid var(--bd);border-radius:12px;padding:10px}
select option{color:#111}
textarea{min-height:84px;resize:vertical}
button{font:inherit;border:0;border-radius:12px;padding:10px 14px;background:var(--g);color:#052e16;font-weight:700;cursor:pointer}
button.sec{background:rgba(255,255,255,.07);color:var(--tx);border:1px solid var(--bd);font-weight:500}
button.x{background:none;color:var(--mut);padding:0 6px;font-size:20px;border:0}
.pill{width:auto;padding:7px 12px;border-radius:20px;font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip2{padding:7px 13px;border-radius:20px;font-size:13px;background:rgba(255,255,255,.06);border:1px solid var(--bd);color:var(--mut);cursor:pointer}
.chip2.on{background:var(--g);color:#052e16;border-color:var(--g);font-weight:700}

/* deck */
.deckwrap{margin:6px 0 4px}
.deck{position:relative;width:min(100%,340px);aspect-ratio:1.586;margin:34px auto 12px;touch-action:none;perspective:900px}
.cc{position:absolute;inset:0;border-radius:20px;padding:16px;color:#fff;direction:ltr;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;
background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 14px 30px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.28);
transition:transform .38s cubic-bezier(.2,.8,.2,1),opacity .3s,filter .3s;user-select:none;-webkit-user-select:none;cursor:grab;will-change:transform}
.cc::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 80% at 15% 0%,rgba(255,255,255,.24),transparent 55%);pointer-events:none}
.cc .t1{display:flex;justify-content:space-between;align-items:flex-start}
.cc .bk{font-weight:800;font-size:17px;letter-spacing:.2px;unicode-bidi:plaintext}
.cc .bd{font-size:10px;font-weight:800;letter-spacing:1.5px;padding:4px 9px;border-radius:20px;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.25)}
.chipic{width:38px;height:28px;border-radius:6px;background:linear-gradient(135deg,#f6dc93,#b88a2e);box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.cc .num{font-size:17px;letter-spacing:2.5px;font-variant-numeric:tabular-nums;text-shadow:0 1px 2px rgba(0,0,0,.3)}
.cc .t3{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.cc small{display:block;font-size:10px;opacity:.75;margin-bottom:1px;unicode-bidi:plaintext}
.cc b{font-size:15px}
.empty{position:absolute;inset:0;border-radius:20px;border:2px dashed rgba(255,255,255,.2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--mut);text-align:center;cursor:pointer;touch-action:auto}
.dots{display:flex;gap:6px;justify-content:center;margin-bottom:8px}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.2);transition:.3s}
.dots i.on{background:var(--g);width:18px;border-radius:6px}
.hint{text-align:center;color:var(--mut);font-size:12px;margin:0 0 8px}

/* stats */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{text-align:center;padding:10px 4px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--bd)}
.stat small{display:block;color:var(--mut);font-size:12px;margin-bottom:2px}
.stat b{font-size:16px}
.out{color:var(--red)}.in{color:var(--g)}
.lim{margin-top:10px;font-size:12px;color:var(--mut)}
.prog{height:7px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:5px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--g2),var(--g))}
.prog i.warn{background:linear-gradient(90deg,#f59e0b,var(--red))}

/* charts */
.tabs{display:flex;gap:16px;border-bottom:1px solid var(--bd);margin-bottom:12px}
.tabs span{padding:6px 0 9px;color:var(--mut);cursor:pointer;font-size:14px;border-bottom:2px solid transparent}
.tabs span.on{color:var(--g);border-color:var(--g);font-weight:700}
.mbars{display:flex;align-items:flex-end;gap:8px;height:130px}
.mb{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px}
.pair{display:flex;align-items:flex-end;gap:3px;height:108px}
.pair i{width:11px;border-radius:5px 5px 2px 2px;min-height:2px}
.bi{background:linear-gradient(180deg,var(--g),var(--g2))}
.bo{background:rgba(255,255,255,.28)}
.mb span{font-size:11px;color:var(--mut)}
.leg{display:flex;gap:14px;font-size:12px;color:var(--mut);margin-top:10px}
.leg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-inline-end:5px}
.bar{margin:9px 0}
.bar .t{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.bar .b{height:8px;background:rgba(255,255,255,.07);border-radius:6px;overflow:hidden}
.bar .b i{display:block;height:100%;background:linear-gradient(90deg,var(--g2),var(--g));border-radius:6px}

/* list */
.tx{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-top:1px solid var(--bd)}
.tx:first-child{border-top:0}
.tx .m{font-weight:600;font-size:14px}
.tx .s{font-size:12px;color:var(--mut);margin-top:2px}
.tx .a{font-weight:700;white-space:nowrap;text-align:left;display:flex;flex-direction:column;align-items:flex-end}
.sel{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.sel select{width:auto;padding:4px 8px;font-size:12px;border-radius:10px}
.mut{color:var(--mut);font-size:13px}
.ok{color:var(--g);font-size:13px;margin:8px 0 0;min-height:18px}
details summary{cursor:pointer;font-weight:600}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#0b1f16;border:1px solid var(--g);color:var(--tx);padding:10px 16px;border-radius:22px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:50;max-width:90%;text-align:center}
#toast.on{opacity:1}

/* sheet */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.62);display:none;align-items:flex-end;justify-content:center;z-index:40}
.sheet.on{display:flex}
.sheetin{width:100%;max-width:640px;max-height:90vh;overflow:auto;border-radius:22px 22px 0 0;margin:0;background:#0d1a14;padding:16px 16px 28px}
.arow{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--bd);cursor:pointer}
.arow:first-of-type{border-top:0}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;margin-inline-end:8px;vertical-align:middle}
.colors{display:flex;gap:10px;margin:4px 0}
.colors i{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer}
.colors i.on{border-color:#fff}
.form{display:grid;gap:8px}
</style>
</head>
<body>

<div class="top">
  <h1>💰 مصروفي</h1>
  <select id="month" class="pill" style="width:auto" onchange="render()"></select>
</div>

<div class="deckwrap">
  <div class="deck" id="deck"></div>
  <div class="dots" id="dots"></div>
  <p class="hint" id="hint">اسحب الكارت اللي فوق في أي اتجاه عشان اللي بعده يبان</p>
  <div class="row between" style="margin-top:6px">
    <div class="chips" id="viewChips">
      <span class="chip2 on" data-v="card" onclick="setView('card')">الكارت ده</span>
      <span class="chip2" data-v="all" onclick="setView('all')">كل الكروت</span>
    </div>
    <button class="sec pill" onclick="openSheet()">⚙️ الكروت</button>
  </div>
</div>

<div class="glass" style="margin-top:14px">
  <div class="grid3">
    <div class="stat"><small>مصروفات</small><b class="out" id="sOut">0</b></div>
    <div class="stat"><small>دخل</small><b class="in" id="sIn">0</b></div>
    <div class="stat"><small>الصافي</small><b id="sNet">0</b></div>
  </div>
  <div id="lim"></div>
</div>

<div class="glass">
  <h2>➕ الصق رسالة البنك</h2>
  <textarea id="sms" placeholder="الصق نص الرسالة… هعرف البنك والكارت (كريديت ولا ديبيت) لوحدي"></textarea>
  <div class="row" style="margin-top:8px">
    <button onclick="addFromBox()">حلّل وضيف</button>
    <button class="sec" onclick="pasteClip()">لصق من الكليبورد</button>
  </div>
  <p class="ok" id="res"></p>
</div>

<div class="glass">
  <div class="tabs" id="tabs">
    <span class="on" data-t="inout" onclick="setTab('inout')">دخل وخرج</span>
    <span data-t="spend" onclick="setTab('spend')">التصنيفات</span>
    <span data-t="merch" onclick="setTab('merch')">الأماكن</span>
  </div>
  <div id="insights"></div>
</div>

<div class="glass">
  <h2>🧾 العمليات</h2>
  <div id="list"></div>
</div>

<div class="glass">
  <details>
    <summary>إضافة عملية يدوي</summary>
    <div class="form" style="margin-top:10px">
      <input id="mAmt" type="number" inputmode="decimal" placeholder="المبلغ">
      <input id="mMer" placeholder="الوصف / المكان">
      <select id="mCat"></select>
      <select id="mAcc"></select>
      <select id="mDir"><option value="out">مصروف</option><option value="in">دخل</option></select>
      <button onclick="addManual()">إضافة</button>
    </div>
  </details>
</div>

<div class="glass">
  <details>
    <summary>نسخ احتياطي</summary>
    <div class="form" style="margin-top:10px">
      <button class="sec" onclick="copyBackup()">نسخ البيانات (JSON) للكليبورد</button>
      <button class="sec" onclick="exportCSV()">تنزيل CSV</button>
      <textarea id="restore" placeholder="الصق نسخة JSON هنا للاستعادة"></textarea>
      <button class="sec" onclick="restoreBackup()">استعادة</button>
      <button class="sec" onclick="wipe()" style="color:var(--red)">مسح كل البيانات</button>
    </div>
  </details>
</div>

<div class="sheet" id="sheet" onclick="if(event.target===this)closeSheet()">
  <div class="sheetin glass">
    <div class="row between"><h2 id="shT" style="margin:0">إدارة الكروت</h2><button class="x" onclick="closeSheet()">×</button></div>
    <div id="accList" style="margin-top:8px"></div>
    <h3 id="formT">كارت جديد</h3>
    <div class="form">
      <select id="aBank" onchange="bankChange()"></select>
      <input id="aBankC" placeholder="اسم البنك / المحفظة" style="display:none">
      <div class="chips" id="aType">
        <span class="chip2 on" data-v="debit" onclick="setAType('debit')">Debit</span>
        <span class="chip2" data-v="credit" onclick="setAType('credit')">Credit</span>
      </div>
      <input id="aLast" inputmode="numeric" maxlength="4" placeholder="آخر 4 أرقام من الكارت">
      <input id="aName" placeholder="اسم للكارت (اختياري)">
      <input id="aLimit" type="number" inputmode="decimal" placeholder="الحد الائتماني (للكريدت – اختياري)">
      <div class="colors" id="aColors"></div>
      <div class="row"><button onclick="saveAcc()">حفظ</button><button class="sec" onclick="resetForm()">جديد</button></div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const KEY='masrofi_v2';
const CATS=['أكل وشراب','سوبرماركت','مواصلات','فواتير واتصالات','تسوق','ترفيه','صحة','تحويلات','سحب نقدي','دخل','أخرى'];
const COLORS=[['#0f3d2a','#22c55e'],['#0b3b3a','#14b8a6'],['#14305e','#3b82f6'],['#3b1d6e','#8b5cf6'],['#5a2a0c','#f59e0b'],['#5b1534','#ec4899'],['#1f2430','#64748b']];
const BANKS=[
 {n:'CIB',k:['cib','البنك التجاري الدولي','التجاري الدولي','commercial international']},
 {n:'البنك الأهلي',k:['nbe','national bank of egypt','البنك الأهلي','الأهلي المصري','البنك الاهلي']},
 {n:'بنك مصر',k:['banque misr','بنك مصر']},
 {n:'QNB',k:['qnb']},
 {n:'HSBC',k:['hsbc']},
 {n:'بنك القاهرة',k:['banque du caire','بنك القاهرة']},
 {n:'بنك الإسكندرية',k:['alexbank','alex bank','بنك الاسكندرية','بنك الإسكندرية']},
 {n:'AAIB',k:['aaib','arab african']},
 {n:'ADIB',k:['adib','abu dhabi islamic']},
 {n:'Emirates NBD',k:['emirates nbd','enbd']},
 {n:'FAB',k:['first abu dhabi','fab']},
 {n:'Mashreq',k:['mashreq','المشرق']},
 {n:'NBK',k:['nbk']},
 {n:'بنك فيصل',k:['faisal','فيصل الإسلامي']},
 {n:'Telda',k:['telda','تيلدا']},
 {n:'فودافون كاش',k:['vodafone cash','فودافون كاش']},
 {n:'انستاباي',k:['instapay','انستاباي','إنستاباي']},
 {n:'Valu',k:['valu','فاليو']}
];
const RULES=[
‎ ['سحب نقدي',['atm','سحب نقدي','cash withdrawal','withdrawal','سحب']],
‎ ['أكل وشراب',['talabat','طلبات','elmenus','mcdonald','kfc','burger','pizza','restaurant','مطعم','cafe','café','coffee','كافيه','starbucks','costa','breadfast','cilantro','hardees','papa john','mrsool']],
‎ ['سوبرماركت',['carrefour','كارفور','spinneys','hyper','supermarket','سوبر ماركت','سوبرماركت','metro market','seoudi','سعودي','ragab','fathalla','gomla','بقالة','kazyon','خير زمان']],
‎ ['مواصلات',['uber','careem','كريم','indrive','swvl','بنزين','petrol','wataniya','وطنية','total','mobil','chillout','coop','مترو','قطار','egyptair','مصر للطيران','parking','جراج']],
‎ ['فواتير واتصالات',['vodafone','فودافون','orange','أورانج','etisalat','اتصالات','we ','te data','تي داتا','كهرباء','electric','غاز','مياه','water','فاتورة','bill','internet','انترنت','fawry','فوري','aman','أمان']],
‎ ['تسوق',['amazon','noon','jumia','shein','mall','مول','h&m','zara','defacto','lc waikiki','decathlon','ikea','b.tech','btech','2b','ملابس','temu','aliexpress']],
‎ ['ترفيه',['netflix','spotify','shahid','watch it','cinema','سينما','vox','playstation','psn','steam','apple.com','google play','youtube','anghami','xbox']],
‎ ['صحة',['pharmacy','صيدلية','19011','el ezaby','العزبي','seif','سيف','مستشفى','hospital','clinic','عيادة','lab','معمل','دكتور','دواء']],
‎ ['تحويلات',['instapay','انستاباي','إنستاباي','transfer','تحويل','حولت','vodafone cash','فودافون كاش','wallet','محفظة']]
];
const CREDIT=/(credited|credit |received|deposit|salary|refund|cashback|إيداع|ايداع|استلام|استلمت|تم إضافة|تم اضافة|اضافة|إضافة|راتب|دائن|وارد|تحويل من|مرتجع|استرداد|تم استرجاع|وصلك)/i;
const DEBIT=/(purchase|spent|withdraw|debited|debit |paid|payment|transfer to|sent|pos |شراء|سحب|خصم|تم دفع|دفع|تحويل إلى|تحويل الى|حولت|مدين|عملية|مبلغ)/i;

/* ---------- state ---------- */
let S=loadState(),view='card',tab='inout',editId=null,aType='debit',aColor=0;
function loadState(){
  try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.tx)){s.accounts=s.accounts||[];s.order=s.order||[];return s}}catch(e){}
  let old=[];try{old=JSON.parse(localStorage.getItem('masrofi_v1'))||[]}catch(e){}
  return{accounts:[],order:[],tx:old};
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('تعذر الحفظ')}}
function fixOrder(){
  const ids=S.accounts.map(a=>a.id);
  S.order=S.order.filter(id=>ids.includes(id));
  ids.forEach(id=>{if(!S.order.includes(id))S.order.push(id)});
}
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('on'),2800)}
const fmt=n=>Number(n).toLocaleString('en-US',{maximumFractionDigits:2});
function hash(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return 'h'+h}
function norm(s){return s.replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/٫/g,'.').replace(/٬/g,',')}
const monthKey=ts=>{const d=new Date(ts);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
const accById=id=>S.accounts.find(a=>a.id===id);
const accLabel=a=>a?(a.bank+' '+(a.type==='credit'?'Credit':'Debit')+(a.last4?' ••'+a.last4:'')):'غير محدد';

/* ---------- parsing ---------- */
function detectBank(t){
  const l=t.toLowerCase();
  for(const b of BANKS)for(const k of b.k){
    if(/^[\x00-\x7f]+$/.test(k)){if(new RegExp('\\b'+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b').test(l))return b.n}
    else if(l.includes(k))return b.n;
  }
  return '';
}
function categorize(s){
  s=s.toLowerCase()+' ';
  for(const[cat,keys]of RULES)for(const k of keys)if(s.includes(k))return cat;
  return 'أخرى';
}
function parse(raw){
  const t=norm(raw).replace(/\s+/g,' ').trim();
  if(!t)return null;
  const num='(\\d{1,3}(?:,\\d{3})+(?:\\.\\d+)?|\\d+(?:\\.\\d+)?)';
  const cur='(?:\\bEGP\\b|\\bLE\\b|\\bL\\.E\\.?|جنيه|ج\\.م|£)';
  const re=new RegExp(cur+'\\s*'+num+'|'+num+'\\s*'+cur,'gi');
  let amount=null;
  for(const m of t.matchAll(re)){
    const ctx=t.slice(Math.max(0,m.index-28),m.index).toLowerCase();
    if(/balance|رصيد|available|avail|الحالي|المتاح/.test(ctx))continue;
    amount=parseFloat((m[1]||m[2]).replace(/,/g,''));break;
  }
  if(amount==null||!isFinite(amount)||amount<=0)return null;

  const c=t.search(CREDIT),d=t.search(DEBIT);
  let dir='out';if(c>=0&&(d<0||c<d))dir='in';

  let merchant='';
  const mm=t.match(/(?:\bat\b|@|لدى|عند|merchant[:\s]|\bto\b|\bfrom\b|إلى|الى|\bمن\b)\s*([^.,;()\d][^.,;()]{1,30})/i);
  if(mm)merchant=mm[1].replace(/\b(on|using|card|بتاريخ|بطاقة|في|with)\b.*$/i,'').trim();
  if(!merchant)merchant=t.slice(0,28);

  const cm=t.match(/(?:card|بطاقة|كارت|ending|\*{2,}|x{2,})\D{0,6}(\d{4})/i);
  const card=cm?cm[1]:'';

  const low=t.toLowerCase();
  let cardType='';
  if(/credit\s*card|ائتمان|كريدت|كريديت/.test(low))cardType='credit';
  else if(/debit\s*card|بطاقة خصم|بطاقه خصم|ديبت|prepaid|مسبق|meeza/.test(low))cardType='debit';

  let balance=null;
  const bm=t.match(new RegExp('(?:balance|available(?: credit| balance)?|الرصيد|رصيدك|رصيد|المتاح)[^\\d]{0,25}'+num,'i'));
  if(bm)balance=parseFloat(bm[1].replace(/,/g,''));

  let ts=Date.now();
  let m=t.match(/(\d{4})-(\d{2})-(\d{2})/),dt=null;
  if(m)dt=new Date(+m[1],+m[2]-1,+m[3],12);
  else{m=t.match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
    if(m){let y=+m[3];if(y<100)y+=2000;dt=new Date(y,+m[2]-1,+m[1],12)}}
  if(dt&&!isNaN(dt)&&dt.getTime()<Date.now()+864e5)ts=dt.getTime();

  const cat=dir==='in'?'دخل':categorize(t+' '+merchant);
  return{id:hash(raw.trim()),ts,amount,dir,merchant,card,bank:detectBank(t),cardType,balance,cat,accountId:null,raw:raw.trim().slice(0,400)};
}

/* ---------- accounts ---------- */
function newAccount(o){
  const a={id:'a'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),bank:o.bank||'بنك',type:o.type||'debit',last4:o.last4||'',name:o.name||'',limit:o.limit||0,color:o.color!=null?o.color:S.accounts.length%COLORS.length,balance:null,balTs:0};
  S.accounts.push(a);S.order.push(a.id);
  relink(a);
  return a;
}
function relink(a){
  S.tx.forEach(t=>{
    if(t.accountId)return;
    if(a.last4&&t.card===a.last4)t.accountId=a.id;
    else if(!a.last4&&!t.card&&t.bank&&t.bank===a.bank)t.accountId=a.id;
  });
}
function resolveAccount(r){
  const A=S.accounts;let acc=null,created=false;
  if(r.card)acc=A.find(a=>a.last4===r.card&&(!r.bank||a.bank===r.bank))||A.find(a=>a.last4===r.card)||null;
  if(!acc&&r.bank){
    let c=A.filter(a=>a.bank===r.bank);
    if(r.cardType){const c2=c.filter(a=>a.type===r.cardType);if(c2.length)c=c2}
    if(r.card)c=c.filter(a=>!a.last4);
    acc=c[0]||null;
  }
  if(!acc&&(r.bank||r.card)){acc=newAccount({bank:r.bank||'بنك',type:r.cardType||'debit',last4:r.card||''});created=true}
  return{acc,created};
}

/* ---------- add / edit tx ---------- */
function add(r,silent){
  if(!r){if(!silent)toast('مش لاقي مبلغ في الرسالة');return false}
  if(S.tx.some(x=>x.id===r.id)){if(!silent)toast('الرسالة دي متسجلة قبل كده');return false}
  const{acc,created}=resolveAccount(r);
  if(acc){
    r.accountId=acc.id;
    if(r.balance!=null&&r.ts>=(acc.balTs||0)){acc.balance=r.balance;acc.balTs=r.ts}
    if(r.cardType&&!acc.last4&&!created)acc.type=r.cardType;
  }
  S.tx.push(r);
  if(acc)S.order=[acc.id,...S.order.filter(x=>x!==acc.id)];
  save();
  $('res').textContent='اتسجلت على: '+accLabel(acc)+(created?' (كارت جديد اتضاف تلقائي)':'');
  if(created)renderDeck();
  render();
  if(!silent)toast((r.dir==='in'?'+ ':'- ')+fmt(r.amount)+' · '+accLabel(acc));
  return true;
}
function addFromBox(){
  const parts=$('sms').value.split(/\n\s*\n/).filter(x=>x.trim());
  let n=0;parts.forEach(p=>{if(add(parse(p),true))n++});
  if(n){toast('تمت إضافة '+n+' عملية');$('sms').value=''}else toast('مفيش عمليات جديدة');
}
async function pasteClip(){try{$('sms').value=await navigator.clipboard.readText()}catch(e){toast('الصق يدوي في الخانة')}}
function addManual(){
  const a=parseFloat($('mAmt').value);if(!a)return toast('اكتب المبلغ');
  const dir=$('mDir').value,accId=$('mAcc').value||null;
  const x={id:'m'+Date.now(),ts:Date.now(),amount:a,dir,merchant:$('mMer').value||'يدوي',card:'',bank:'',cardType:'',balance:null,cat:dir==='in'?'دخل':$('mCat').value,accountId:accId,raw:''};
  S.tx.push(x);if(accId)S.order=[accId,...S.order.filter(i=>i!==accId)];save();render();
  $('mAmt').value='';$('mMer').value='';toast('اتضافت');
}
function setCat(id,cat){const x=S.tx.find(t=>t.id===id);if(x){x.cat=cat;save();render()}}
function setAcc(id,v){const x=S.tx.find(t=>t.id===id);if(x){x.accountId=v||null;save();render()}}
function del(id){if(confirm('مسح العملية؟')){S.tx=S.tx.filter(t=>t.id!==id);save();render()}}

/* ---------- deck ---------- */
function place(el,pos){
  el.dataset.pos=pos;
  el.style.zIndex=100-pos;
  el.style.transform='translateY('+(-pos*13)+'px) scale('+(1-pos*.055)+')';
  el.style.opacity=pos>3?0:1;
  el.style.filter=pos?'brightness('+(1-pos*.16)+')':'none';
  el.style.pointerEvents=pos?'none':'auto';
}
function layout(){
  S.order.forEach((id,i)=>{const el=$('deck').querySelector('.cc[data-id="'+id+'"]');if(el)place(el,i)});
  $('dots').innerHTML=S.order.length>1?S.order.map((_,i)=>'<i class="'+(i===0?'on':'')+'"></i>').join(''):'';
  $('hint').style.display=S.order.length>1?'':'none';
}
function renderDeck(){
  fixOrder();
  const mk=$('month').value||monthKey(Date.now());
  const d=$('deck');
  if(!S.accounts.length){
    d.innerHTML='<div class="empty" onclick="openSheet()"><div style="font-size:26px">＋</div><div>ضيف أول كارت</div><small>أو الصق رسالة وهيتعمل تلقائي</small></div>';
    $('dots').innerHTML='';$('hint').style.display='none';return;
  }
  d.innerHTML=S.accounts.map(a=>{
    const spent=S.tx.filter(t=>t.accountId===a.id&&t.dir==='out'&&monthKey(t.ts)===mk).reduce((s,t)=>s+t.amount,0);
    const[c1,c2]=COLORS[a.color%COLORS.length];
    const right=a.balance!=null?'<div style="text-align:right"><small>'+(a.type==='credit'?'المتاح':'الرصيد')+'</small><b>'+fmt(a.balance)+'</b></div>':(a.name?'<div style="text-align:right"><small>'+esc(a.name)+'</small></div>':'');
    return '<div class="cc" data-id="'+a.id+'" style="--c1:'+c1+';--c2:'+c2+'">'
      +'<div class="t1"><div class="bk">'+esc(a.bank)+'</div><div class="bd">'+(a.type==='credit'?'CREDIT':'DEBIT')+'</div></div>'
      +'<div class="chipic"></div>'
      +'<div class="num">•••• •••• •••• '+(a.last4?esc(a.last4):'••••')+'</div>'
      +'<div class="t3"><div><small>مصروف الشهر</small><b>'+fmt(spent)+'</b></div>'+right+'</div></div>';
  }).join('');
  layout();
}
function rotate(el){
  S.order.push(S.order.shift());save();
  el.style.transition='none';
  place(el,S.order.length-1);el.style.opacity=0;
  void el.offsetWidth;
  el.style.transition='';
  layout();renderMain();
}
let drag=null;
(function(){
  const deck=$('deck');
  deck.addEventListener('pointerdown',e=>{
    const el=deck.querySelector('.cc[data-pos="0"]');if(!el)return;
    drag={el,x:e.clientX,y:e.clientY,dx:0,dy:0,t:performance.now()};
    el.style.transition='none';
    try{deck.setPointerCapture(e.pointerId)}catch(_){}
  });
  deck.addEventListener('pointermove',e=>{
    if(!drag)return;
    drag.dx=e.clientX-drag.x;drag.dy=e.clientY-drag.y;
    drag.el.style.transform='translate('+drag.dx+'px,'+drag.dy+'px) rotate('+(drag.dx/20)+'deg)';
  });
  function end(){
    if(!drag)return;
    const{el,dx,dy,t}=drag;drag=null;
    const dist=Math.hypot(dx,dy),v=dist/Math.max(1,performance.now()-t);
    el.style.transition='';
    if(S.order.length>1&&(dist>90||(v>.6&&dist>30))){
      const k=650/Math.max(1,dist);
      el.style.transition='transform .28s ease-in,opacity .28s';
      el.style.transform='translate('+dx*k+'px,'+dy*k+'px) rotate('+(dx*k/20)+'deg)';
      el.style.opacity=0;
      setTimeout(()=>rotate(el),280);
    }else layout();
  }
  deck.addEventListener('pointerup',end);
  deck.addEventListener('pointercancel',end);
})();

/* ---------- main render ---------- */
function setView(v){view=v;render()}
function setTab(t){tab=t;renderMain()}
function scoped(){return view==='card'&&S.order.length?S.tx.filter(t=>t.accountId===S.order[0]):S.tx}
function renderMonths(){
  const sel=$('month'),cur=sel.value;
  const keys=[...new Set(S.tx.map(t=>monthKey(t.ts)).concat(monthKey(Date.now())))].sort().reverse();
  sel.innerHTML=keys.map(k=>{const[y,m]=k.split('-');return '<option value="'+k+'">'+new Date(+y,+m-1,1).toLocaleDateString('ar-EG',{month:'long',year:'numeric'})+'</option>'}).join('');
  sel.value=keys.includes(cur)?cur:keys[0];
}
function render(){renderMonths();renderDeck();renderMain()}
function renderMain(){
  document.querySelectorAll('#viewChips .chip2').forEach(c=>c.classList.toggle('on',c.dataset.v===view));
  document.querySelectorAll('#tabs span').forEach(c=>c.classList.toggle('on',c.dataset.t===tab));
  const mk=$('month').value;
  const all=scoped();
  const list=all.filter(t=>monthKey(t.ts)===mk).sort((a,b)=>b.ts-a.ts);
  const out=list.filter(t=>t.dir==='out').reduce((s,t)=>s+t.amount,0);
  const inc=list.filter(t=>t.dir==='in').reduce((s,t)=>s+t.amount,0);
  $('sOut').textContent=fmt(out);$('sIn').textContent=fmt(inc);
  const net=inc-out;$('sNet').textContent=fmt(net);$('sNet').className=net>=0?'in':'out';

  // credit limit bar
  const top=view==='card'?accById(S.order[0]):null;
  $('lim').innerHTML=(top&&top.type==='credit'&&top.limit>0)?'<div class="lim">استهلاك الشهر من الحد: '+fmt(out)+' / '+fmt(top.limit)+'<div class="prog"><i class="'+(out/top.limit>.8?'warn':'')+'" style="width:'+Math.min(100,out/top.limit*100)+'%"></i></div></div>':'';

  // insights
  let h='';
  if(tab==='inout'){
    const[y,m]=mk.split('-').map(Number);const ms=[];
    for(let i=5;i>=0;i--){const d=new Date(y,m-1-i,1);const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
      const l=all.filter(t=>monthKey(t.ts)===k);
      ms.push({lab:(d.getMonth()+1)+'/'+String(d.getFullYear()).slice(2),i:l.filter(t=>t.dir==='in').reduce((s,t)=>s+t.amount,0),o:l.filter(t=>t.dir==='out').reduce((s,t)=>s+t.amount,0)})}
    const mx=Math.max(1,...ms.map(x=>Math.max(x.i,x.o)));
    h='<div class="mbars">'+ms.map(x=>'<div class="mb"><div class="pair"><i class="bi" style="height:'+(x.i/mx*100)+'%"></i><i class="bo" style="height:'+(x.o/mx*100)+'%"></i></div><span>'+x.lab+'</span></div>').join('')+'</div>'
      +'<div class="leg"><span><i style="background:var(--g)"></i>دخل</span><span><i style="background:rgba(255,255,255,.35)"></i>مصروف</span></div>';
  }else{
    const by={};
    list.filter(t=>t.dir==='out').forEach(t=>{const k=tab==='spend'?t.cat:t.merchant.trim().toLowerCase();by[k]=(by[k]||0)+t.amount});
    const rows=Object.entries(by).sort((a,b)=>b[1]-a[1]).slice(0,tab==='spend'?20:8);
    h=rows.length?rows.map(([c,v])=>'<div class="bar"><div class="t"><span>'+esc(c)+'</span><span>'+fmt(v)+' ('+Math.round(v/out*100)+'%)</span></div><div class="b"><i style="width:'+(v/out*100)+'%"></i></div></div>').join(''):'<p class="mut">مفيش مصروفات في الشهر ده</p>';
  }
  $('insights').innerHTML=h;

  // list
  const catOpts=c=>CATS.map(x=>'<option'+(x===c?' selected':'')+'>'+x+'</option>').join('');
  const accOpts=id=>'<option value="">غير محدد</option>'+S.accounts.map(a=>'<option value="'+a.id+'"'+(a.id===id?' selected':'')+'>'+esc(accLabel(a))+'</option>').join('');
  $('list').innerHTML=list.length?list.map(t=>'<div class="tx"><div><div class="m">'+esc(t.merchant)+'</div><div class="s">'+new Date(t.ts).toLocaleDateString('ar-EG')+' · '+esc(accLabel(accById(t.accountId)))+'</div><div class="sel"><select onchange="setCat(\''+t.id+'\',this.value)">'+catOpts(t.cat)+'</select><select onchange="setAcc(\''+t.id+'\',this.value)">'+accOpts(t.accountId)+'</select></div></div><div class="a '+t.dir+'">'+(t.dir==='in'?'+':'-')+fmt(t.amount)+'<button class="x" onclick="del(\''+t.id+'\')">×</button></div></div>').join(''):'<p class="mut">لسه مفيش عمليات</p>';

  // manual form selects
  const ma=$('mAcc'),mv=ma.value;
  ma.innerHTML=accOpts(mv);
}

/* ---------- accounts sheet ---------- */
function openSheet(){resetForm();renderAccList();$('sheet').classList.add('on')}
function closeSheet(){$('sheet').classList.remove('on')}
function bankChange(){$('aBankC').style.display=$('aBank').value==='__other'?'':'none'}
function setAType(v){aType=v;document.querySelectorAll('#aType .chip2').forEach(c=>c.classList.toggle('on',c.dataset.v===v))}
function setAColor(i){aColor=i;drawColors()}
function drawColors(){$('aColors').innerHTML=COLORS.map((c,i)=>'<i class="'+(i===aColor?'on':'')+'" style="background:linear-gradient(135deg,'+c[0]+','+c[1]+')" onclick="setAColor('+i+')"></i>').join('')}
function resetForm(){
  editId=null;aType='debit';aColor=S.accounts.length%COLORS.length;
  $('formT').textContent='كارت جديد';
  $('aBank').value=BANKS[0].n;$('aBankC').value='';$('aLast').value='';$('aName').value='';$('aLimit').value='';
  setAType('debit');drawColors();bankChange();
}
function renderAccList(){
  $('accList').innerHTML=S.accounts.length?S.accounts.map(a=>'<div class="arow" onclick="editAcc(\''+a.id+'\')"><span><span class="dot" style="background:linear-gradient(135deg,'+COLORS[a.color%COLORS.length][0]+','+COLORS[a.color%COLORS.length][1]+')"></span>'+esc(accLabel(a))+(a.name?' · '+esc(a.name):'')+'</span><button class="x" onclick="event.stopPropagation();delAcc(\''+a.id+'\')">🗑</button></div>').join(''):'<p class="mut">لسه مفيش كروت</p>';
}
function editAcc(id){
  const a=accById(id);if(!a)return;editId=id;
  $('formT').textContent='تعديل كارت';
  const known=BANKS.some(b=>b.n===a.bank);
  $('aBank').value=known?a.bank:'__other';$('aBankC').value=known?'':a.bank;bankChange();
  $('aLast').value=a.last4;$('aName').value=a.name;$('aLimit').value=a.limit||'';
  setAType(a.type);aColor=a.color;drawColors();
}
function saveAcc(){
  let bank=$('aBank').value==='__other'?$('aBankC').value.trim():$('aBank').value;
  if(!bank)return toast('اكتب اسم البنك');
  const o={bank,type:aType,last4:($('aLast').value||'').replace(/\D/g,'').slice(0,4),name:$('aName').value.trim(),limit:parseFloat($('aLimit').value)||0,color:aColor};
  if(editId){const a=accById(editId);Object.assign(a,o);relink(a);toast('اتعدل')}
  else{const a=newAccount(o);S.order=[a.id,...S.order.filter(x=>x!==a.id)];toast('اتضاف')}
  save();resetForm();renderAccList();render();
}
function delAcc(id){
  if(!confirm('مسح الكارت؟ عملياته هتفضل بس هتبقى غير محددة.'))return;
  S.accounts=S.accounts.filter(a=>a.id!==id);S.order=S.order.filter(x=>x!==id);
  S.tx.forEach(t=>{if(t.accountId===id)t.accountId=null});
  save();renderAccList();render();
}

/* ---------- backup ---------- */
function copyBackup(){navigator.clipboard.writeText(JSON.stringify(S)).then(()=>toast('اتنسخت'),()=>toast('فشل النسخ'))}
function restoreBackup(){
  try{
    let d=JSON.parse($('restore').value);
    if(Array.isArray(d))d={accounts:[],order:[],tx:d};
    if(!d||!Array.isArray(d.tx))throw 0;
    (d.accounts||[]).forEach(a=>{if(!accById(a.id))S.accounts.push(a)});
    let n=0;d.tx.forEach(r=>{if(r&&r.id&&!S.tx.some(x=>x.id===r.id)){S.tx.push(r);n++}});
    fixOrder();save();render();toast('تمت استعادة '+n+' عملية');$('restore').value='';
  }catch(e){toast('الملف مش صحيح')}
}
function exportCSV(){
  const q=s=>'"'+String(s==null?'':s).replace(/"/g,'""')+'"';
  const h='date,type,amount,category,merchant,account\n';
  const b=S.tx.slice().sort((a,b)=>a.ts-b.ts).map(t=>[new Date(t.ts).toISOString().slice(0,10),t.dir,t.amount,q(t.cat),q(t.merchant),q(accLabel(accById(t.accountId)))].join(',')).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['\ufeff'+h+b],{type:'text/csv'}));a.download='expenses.csv';a.click();
}
function wipe(){if(confirm('هتمسح كل البيانات (الكروت والعمليات)؟ مفيش رجوع.')){S={accounts:[],order:[],tx:[]};save();render()}}

/* ---------- init ---------- */
(function(){
  $('mCat').innerHTML=CATS.filter(c=>c!=='دخل').map(c=>'<option>'+c+'</option>').join('');
  $('aBank').innerHTML=BANKS.map(b=>'<option>'+b.n+'</option>').join('')+'<option value="__other">أخرى…</option>';
  drawColors();
  const m=new URLSearchParams(location.search).get('msg');
  render();
  if(m){history.replaceState(null,'',location.pathname);add(parse(m))}
})();
</script>
